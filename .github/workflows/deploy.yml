name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Build Next.js on GitHub runner (16GB RAM) to avoid OOM crashes on EC2
      - name: Build Next.js application
        run: npm run build

      # Bundle standalone artifacts into a lightweight package (~18MB)
      - name: Prepare standalone deployment package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp Dockerfile.standalone .next/standalone/Dockerfile
          cd .next/standalone && tar -czf ../../app.tar.gz .

      # Transfer pre-built package to EC2 (takes ~3 seconds)
      - name: Transfer package to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.tar.gz"
          target: "~/app"

      # Execute fast Docker build and container restart on EC2 (takes ~5 seconds)
      - name: Run container on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: OPENWEATHER_API_KEY
          command_timeout: 10m
          script: |
            set -e

            mkdir -p ~/app
            cd ~/app

            echo ">>> Extracting pre-built application..."
            tar -xzf app.tar.gz
            rm -f app.tar.gz

            echo ">>> Writing environment configuration..."
            echo "OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}" > .env

            echo ">>> Building lightweight Docker image..."
            docker build -t ec2-cicd-weather .

            echo ">>> Stopping previous container..."
            docker rm -f weather-app || true

            echo ">>> Starting new container..."
            docker run -d \
              --name weather-app \
              -p 80:3000 \
              -p 3000:3000 \
              --env-file .env \
              --restart unless-stopped \
              ec2-cicd-weather

            echo ">>> Cleaning up dangling images..."
            docker image prune -f

            echo ">>> Verifying container status..."
            docker ps --filter "name=weather-app"

            echo ">>> Deployment completed successfully!"
